services:
  backend:
    build: ./backend
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - DATABASE_URL=sqlite:///./data/ews_cache.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./.data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
