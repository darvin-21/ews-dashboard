# Render Blueprint — deploys backend + frontend with one click.
# Free tier. Spin-up after idle takes ~30s.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ews-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"      # locked to render.com hosts by the wildcard regex in main.py
      - key: FRED_API_KEY
        sync: false     # set this in the Render dashboard if you have one
      - key: DATABASE_URL
        value: sqlite:////tmp/ews_cache.db
    # Render free tier doesn't support persistent disks; SQLite lives in /tmp
    # and is recreated on each deploy. Data refetches automatically.

  - type: web
    name: abu-abdullah-ews
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: VITE_API_BASE
        # Hardcoded because Render's fromService:hostport isn't passed to Docker build args.
        # Update this if you rename the backend service or it gets a different suffix.
        value: https://ews-backend-3mhh.onrender.com
